name: "Correction or question / 勘误与问题"
description: "Report a manuscript issue or ask about a paper or its supplements."
title: "[Paper ID] "
body:
  - type: markdown
    attributes:
      value: "Please identify the exact paper and version so the discussion refers to the same manuscript. / 请注明具体论文与版本。"
  - type: input
    id: paper
    attributes:
      label: "Paper ID and version / 论文编号与版本"
      description: "A release URL is also sufficient. / 也可以直接提供发布页面链接。"
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: "Location / 具体位置"
      description: "Page, theorem, proof step, or supplementary filename. / 页码、定理、证明步骤或附件文件名。"
  - type: textarea
    id: description
    attributes:
      label: "Question or concern / 问题说明"
      description: "Explain the issue and include the relevant argument or calculation when appropriate. / 请说明问题，必要时附上论证或计算。"
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: "Suggested correction / 建议修改"
      description: "Optional. / 选填。"
